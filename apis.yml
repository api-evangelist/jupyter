aid: jupyter
name: Jupyter
description: >-
  Project Jupyter is an open-source initiative that develops the software, open standards, and services for interactive
  computing across dozens of programming languages. The Jupyter ecosystem includes Jupyter Notebook, JupyterLab, Jupyter
  Server, JupyterHub, the Jupyter messaging protocol, and supporting client libraries.
